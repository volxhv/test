services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: notes
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    image: ${BACKEND_IMAGE:?required}:${IMAGE_TAG:?required}
    environment:
      DATABASE_URL: postgres://notes:${DB_PASSWORD}@db:5432/notes
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:?required}:${IMAGE_TAG:?required}
    restart: unless-stopped
  nginx:
    image: ${NGINX_IMAGE:?required}:${IMAGE_TAG:?required}
    depends_on: [backend, frontend]
    ports: ["${COLOR_PORT:?required}:80"]
    networks:
      default: {}
      lab:
        aliases: ["nginx-${COLOR:?required}"]
    restart: unless-stopped
volumes:
  db_data:
networks:
  lab:
    external: true
    name: practice3-net
